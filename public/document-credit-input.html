<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>신용도 입력</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --line: #d9e2ef;
      --text: #111827;
      --muted: #667085;
      --primary: #1565c0;
      --primary-dark: #0d47a1;
      --danger: #b42318;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, "Noto Sans CJK KR", "Malgun Gothic", sans-serif;
    }

    .page {
      width: min(720px, calc(100vw - 32px));
      margin: 32px auto;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 24px;
      font-size: 22px;
      line-height: 1.3;
    }

    form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    label {
      display: grid;
      gap: 7px;
      font-size: 13px;
      font-weight: 700;
    }

    .full { grid-column: 1 / -1; }

    input,
    select {
      width: 100%;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 11px;
      color: var(--text);
      font-size: 14px;
      background: #fff;
    }

    input:focus,
    select:focus {
      outline: 2px solid rgba(21, 101, 192, 0.18);
      border-color: var(--primary);
    }

    .actions {
      grid-column: 1 / -1;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 8px;
    }

    button {
      height: 38px;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 0 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary {
      background: var(--primary);
      color: #fff;
    }

    .primary:hover { background: var(--primary-dark); }

    .secondary {
      background: #fff;
      border-color: var(--line);
      color: #344054;
    }

    .status {
      grid-column: 1 / -1;
      min-height: 20px;
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .status.error { color: var(--danger); }

    @media (max-width: 640px) {
      .page { margin: 16px auto; }
      .panel { padding: 18px; }
      form { grid-template-columns: 1fr; }
      .full { grid-column: auto; }
      .actions { justify-content: stretch; }
      button { flex: 1; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="panel">
      <p class="eyebrow">문서</p>
      <h1>신용도 입력</h1>
      <form id="credit-form">
        <label class="full">
          회사명
          <input id="company" name="company" autocomplete="organization" required />
        </label>

        <label>
          신용도
          <select id="grade" name="grade" required></select>
        </label>

        <label>
          만료월
          <input id="expireMonth" name="expireMonth" type="month" />
        </label>

        <label class="full">
          회사 주소
          <input id="address" name="address" autocomplete="street-address" />
        </label>

        <label>
          대표자명
          <input id="ceo" name="ceo" autocomplete="name" />
        </label>

        <div class="actions">
          <button class="secondary" type="button" id="close-btn">닫기</button>
          <button class="primary" type="submit">저장</button>
        </div>

        <p class="status" id="status"></p>
      </form>
    </section>
  </main>

  <script>
    const STORAGE_KEY = 'sms-credits';
    const grades = [
      'AAA', 'AA+', 'AA', 'AA-', 'A+', 'A', 'A-',
      'BBB+', 'BBB', 'BBB-', 'BB+', 'BB', 'BB-',
      'B+', 'B', 'B-', 'CCC', 'CC', 'C', 'D',
    ];

    const params = new URLSearchParams(window.location.search);
    const fields = {
      company: document.getElementById('company'),
      grade: document.getElementById('grade'),
      address: document.getElementById('address'),
      ceo: document.getElementById('ceo'),
      expireMonth: document.getElementById('expireMonth'),
      status: document.getElementById('status'),
    };

    fields.grade.innerHTML = grades.map((grade) => `<option value="${grade}">${grade}</option>`).join('');
    fields.company.value = params.get('company') || '';

    function uid(prefix = 'CR') {
      return `${prefix}-${Date.now().toString(36)}${Math.random().toString(36).slice(2, 7)}`;
    }

    function readCredits() {
      try {
        const raw = window.localStorage.getItem(STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch (error) {
        return [];
      }
    }

    function writeCredits(items) {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }

    function sameCompany(item, company) {
      return String(item.company || '').trim() === company.trim();
    }

    function prefillExisting() {
      const company = fields.company.value.trim();
      if (!company) return;
      const existing = readCredits().find((item) => sameCompany(item, company));
      if (!existing) return;
      fields.grade.value = existing.grade || 'A';
      fields.address.value = existing.address || '';
      fields.ceo.value = existing.ceo || '';
      fields.expireMonth.value = existing.expireMonth || '';
    }

    function setStatus(message, isError = false) {
      fields.status.textContent = message;
      fields.status.className = isError ? 'status error' : 'status';
    }

    document.getElementById('credit-form').addEventListener('submit', (event) => {
      event.preventDefault();
      const company = fields.company.value.trim();
      if (!company) {
        setStatus('회사명을 입력하세요.', true);
        fields.company.focus();
        return;
      }

      const credits = readCredits();
      const existing = credits.find((item) => sameCompany(item, company));
      const saved = {
        ...(existing || {}),
        id: existing?.id || uid('CR'),
        company,
        grade: fields.grade.value,
        address: fields.address.value.trim(),
        ceo: fields.ceo.value.trim(),
        bizNo: existing?.bizNo || '',
        expireMonth: fields.expireMonth.value,
        updatedAt: new Date().toISOString(),
      };

      const nextCredits = existing
        ? credits.map((item) => (sameCompany(item, company) ? saved : item))
        : [saved, ...credits];

      writeCredits(nextCredits);

      try {
        window.opener?.postMessage({ type: 'DOCUMENT_CREDIT_SAVED', company }, window.location.origin);
      } catch (error) {
        // 저장은 완료되었으므로 창 간 알림 실패는 무시합니다.
      }

      setStatus('저장되었습니다.');
    });

    document.getElementById('close-btn').addEventListener('click', () => {
      window.close();
    });

    fields.company.addEventListener('change', prefillExisting);
    prefillExisting();
  </script>
</body>
</html>
